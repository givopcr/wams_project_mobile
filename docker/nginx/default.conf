server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;
    charset utf-8;

    # File upload (gambar barang/unit) dilayani langsung dari storage.
    # Pengganti symlink "php artisan storage:link", karena symlink buatan
    # Windows/Laragon tidak terbaca dari dalam container Linux.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
