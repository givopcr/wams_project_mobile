services:
  # Laravel (PHP-FPM)
  app:
    build: .
    container_name: wams_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      # Menimpa nilai DB di .env HANYA di dalam Docker,
      # jadi .env tetap bisa dipakai Laragon seperti biasa.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wams_project
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  # Web server -> http://localhost:8000
  nginx:
    image: nginx:alpine
    container_name: wams_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Database MySQL -> dari Windows: 127.0.0.1:3307 (3306 dipakai Laragon)
  mysql:
    image: mysql:8.0
    container_name: wams_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wams_project
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # phpMyAdmin -> http://localhost:8080 (user: root / pass: root)
  phpmyadmin:
    image: phpmyadmin
    container_name: wams_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql

volumes:
  mysql_data:
